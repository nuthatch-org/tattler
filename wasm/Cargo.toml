[package]
name = "tattler-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The tattler verifier, compiled for the browser. Deliberately not a second implementation."

[lib]
crate-type = ["cdylib"]

[dependencies]
tattler = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
ed25519-dalek = { version = "2" }
hex = "0.4"
