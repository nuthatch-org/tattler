[workspace]
members = ["wasm"]
resolver = "2"

[package]
name = "tattler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Signed, replayable receipts for indexed chain data. An answer you can hand a third party who does not trust you."

[[bin]]
name = "tattler"
path = "src/main.rs"
required-features = ["cli"]

# The library is pure: canonicalise, sign, verify. No clock, no network, no randomness.
#
# That is not tidiness, it is the property that makes the browser build worth trusting. Everything
# needed to *issue* a receipt lives behind `cli`, so a verifier built with
# `--no-default-features` cannot generate a key, cannot reach the network, and therefore cannot
# report home about what it was asked to check. It is not merely that it does not; it cannot,
# and the dependency graph is the proof.
[features]
default = ["cli"]
cli = ["dep:clap", "dep:ureq", "dep:time", "dep:rand_core", "ed25519-dalek/rand_core"]

[dependencies]
ed25519-dalek = { version = "2" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"

clap = { version = "4", features = ["derive"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
time = { version = "0.3", features = ["formatting", "macros"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
